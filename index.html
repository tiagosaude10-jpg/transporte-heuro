<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#073b86">
  <meta name="description" content="Solicitação, execução e acompanhamento de transportes do HEURO">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.json?v=20260807-1">
  <link rel="stylesheet" href="style.css?v=20260807-1">
  <title>Transporte HEURO</title>
</head>
<body>
  <main id="app" aria-live="polite">
    <section id="welcomeScreen" class="screen welcome-screen active" aria-label="Tela inicial do Transporte HEURO">
      <div class="welcome-frame">
        <img class="welcome-image" src="IMG_1774.webp" alt="HEURO Transporte — Agendamentos e Operações">
        <button id="welcomeEnter" class="welcome-hotspot welcome-enter" type="button" aria-label="Entrar no aplicativo"></button>
        <button id="welcomeChangeUser" class="welcome-hotspot welcome-change" type="button" aria-label="Trocar usuário"></button>
      </div>
    </section>

    <section id="loginScreen" class="screen auth-screen" aria-labelledby="loginTitle">
      <div class="auth-shell">
        <button class="plain-back" type="button" data-go-welcome>← Voltar</button>
        <div class="auth-brand" aria-hidden="true"><span>HEURO</span><small>TRANSPORTE</small></div>
        <div class="auth-intro">
          <span class="kicker">Acesso ao sistema</span>
          <h1 id="loginTitle">Bem-vindo</h1>
          <p>Entre com seu CPF ou e-mail e sua senha.</p>
        </div>
        <form id="loginForm" class="panel form-stack" novalidate>
          <label for="loginIdentifier">CPF ou e-mail</label>
          <input id="loginIdentifier" type="text" autocomplete="username" inputmode="email" placeholder="Digite seu CPF ou e-mail" required>
          <label for="loginPassword">Senha</label>
          <div class="password-field">
            <input id="loginPassword" type="password" autocomplete="current-password" placeholder="Digite sua senha" required>
            <button type="button" data-toggle-password="loginPassword" aria-label="Mostrar senha">Mostrar</button>
          </div>
          <label class="check-row"><input id="rememberLogin" type="checkbox" checked><span>Lembrar meu acesso neste aparelho</span></label>
          <button id="loginSubmit" class="button primary" type="submit">Entrar no sistema</button>
          <button id="openRegister" class="button link" type="button">Realizar primeiro cadastro</button>
          <p id="loginMessage" class="form-message" role="status"></p>
        </form>
      </div>
    </section>

    <section id="registerScreen" class="screen auth-screen" aria-labelledby="registerTitle">
      <div class="auth-shell wide">
        <button id="registerBack" class="plain-back" type="button">← Voltar ao acesso</button>
        <div class="auth-intro">
          <span class="kicker">Primeiro acesso</span>
          <h1 id="registerTitle">Solicitar cadastro</h1>
          <p>Preencha os dados corretamente. O acesso será liberado por um administrador.</p>
        </div>
        <form id="registerForm" class="panel form-grid" novalidate>
          <label class="span-2">Nome completo<input id="regFullName" autocomplete="name" required></label>
          <label>Nome para exibição<input id="regDisplayName" autocomplete="nickname" placeholder="Como deve aparecer no sistema"></label>
          <label>Nome de usuário<input id="regUsername" autocomplete="username" minlength="3" maxlength="40" required></label>
          <label>CPF<input id="regCpf" inputmode="numeric" autocomplete="off" maxlength="14" placeholder="000.000.000-00" required></label>
          <label>Data de nascimento<input id="regBirthDate" type="date" required></label>
          <label>E-mail<input id="regEmail" type="email" autocomplete="email" required></label>
          <label>Telefone/WhatsApp<input id="regPhone" type="tel" inputmode="tel" autocomplete="tel" required></label>
          <label>Vínculo institucional
            <select id="regLink" required>
              <option value="">Selecione</option>
              <option value="heuro">Profissional do HEURO</option>
              <option value="empresa">Empresa/equipe de transporte</option>
              <option value="administracao">Administração geral</option>
            </select>
          </label>
          <label id="regSectorField" class="hidden">Setor do HEURO<input id="regSector" placeholder="Ex.: Clínica Médica"></label>
          <label id="regCompanyField" class="hidden">Empresa de transporte<input id="regCompany" placeholder="Nome da empresa"></label>
          <label>Cargo ou função<input id="regJobRole" placeholder="Ex.: Enfermeiro, motorista" required></label>
          <label id="regAccessField">Acesso solicitado
            <select id="regAccess" required>
              <option value="solicitante">Solicitante</option>
              <option value="executante">Executante</option>
              <option value="solicitante_executante">Solicitante e executante</option>
            </select>
          </label>
          <label>Senha<input id="regPassword" type="password" autocomplete="new-password" minlength="8" required></label>
          <label>Confirmar senha<input id="regPasswordConfirm" type="password" autocomplete="new-password" minlength="8" required></label>
          <label class="check-row span-2"><input id="regDeclaration" type="checkbox" required><span>Declaro que os dados informados são verdadeiros e estou ciente de que o cadastro depende de autorização.</span></label>
          <div class="span-2"><button id="registerSubmit" class="button primary" type="submit">Enviar cadastro para aprovação</button><p id="registerMessage" class="form-message" role="status"></p></div>
        </form>
      </div>
    </section>

    <section id="homeScreen" class="screen app-screen" aria-labelledby="homeTitle">
      <header class="app-header">
        <div class="brand-lockup"><span class="brand-heuro">HEURO</span><small>TRANSPORTE</small></div>
        <div class="header-actions">
          <span id="connectionState" class="connection-state" title="Conexão com a central"></span>
          <button id="refreshButton" class="icon-button" type="button" aria-label="Atualizar dados">↻</button>
          <button id="logoutButton" class="logout-button" type="button">Sair</button>
        </div>
      </header>

      <div id="homeHero" class="home-hero">
        <div><span class="kicker light">Central de transportes</span><h1 id="homeTitle">Olá</h1><p id="homeRole"></p></div>
        <div id="syncTime" class="sync-time"></div>
      </div>

      <section id="dashboard" class="dashboard" aria-label="Tela de comando">
        <div id="summaryCards" class="summary-grid"></div>
        <div id="commandCards" class="command-grid"></div>
      </section>

      <section id="viewScreen" class="view-screen hidden">
        <div class="view-header">
          <button id="viewBack" class="back-button" type="button">← Voltar</button>
          <div><span id="viewKicker" class="kicker"></span><h2 id="viewTitle"></h2><p id="viewDescription"></p></div>
        </div>
        <div id="viewContent"></div>
      </section>

      <nav id="bottomNav" class="bottom-nav" aria-label="Navegação principal">
        <button type="button" data-nav="home" class="active"><span>⌂</span>Início</button>
        <button type="button" data-nav="all"><span>▤</span>Solicitados</button>
        <button type="button" data-nav="pending"><span>◷</span>Pendentes</button>
        <button type="button" data-nav="history"><span>↶</span>Histórico</button>
        <button type="button" data-nav="profile"><span>♙</span>Perfil</button>
      </nav>
    </section>
  </main>

  <div id="toast" class="toast" role="status"></div>
  <div id="loadingOverlay" class="loading-overlay hidden" role="status"><div class="spinner"></div><strong id="loadingText">Carregando...</strong></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.2/dist/umd/supabase.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@4.2.1/dist/jspdf.umd.min.js" crossorigin="anonymous"></script>
  <script src="supabase-config.js?v=20260807-1"></script>
  <script src="app.js?v=20260807-1"></script>
</body>
</html>
