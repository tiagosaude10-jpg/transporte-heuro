<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b5fa5" />
  <title>Atualizando Transporte HEURO</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#17324d;background:#f4f7fa}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
    main{width:min(100%,460px);background:#fff;border:1px solid #d9e3ec;border-radius:22px;padding:28px;text-align:center;box-shadow:0 12px 34px rgba(19,50,77,.12)}
    h1{margin:0 0 12px;font-size:24px}
    p{margin:0;color:#66788a;line-height:1.5}
    .spinner{width:48px;height:48px;margin:0 auto 20px;border:5px solid #d9e3ec;border-top-color:#0b5fa5;border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <main>
    <div class="spinner" aria-hidden="true"></div>
    <h1>Atualizando o aplicativo</h1>
    <p id="status">Removendo a versão antiga e carregando a nova página de comando…</p>
  </main>
  <script>
    (async () => {
      const status = document.getElementById('status');
      try {
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map(registration => registration.unregister()));
        }
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map(key => caches.delete(key)));
        }
        status.textContent = 'Limpeza concluída. Abrindo a nova versão…';
      } catch (error) {
        status.textContent = 'A limpeza foi concluída parcialmente. Abrindo a nova versão…';
      }
      const target = `index-v2.html?fresh=${Date.now()}`;
      setTimeout(() => location.replace(target), 700);
    })();
  </script>
</body>
</html>
